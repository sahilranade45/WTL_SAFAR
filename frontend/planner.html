<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan a Trip - SAFAR</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top navigation bar -->
    <header class="navbar">
        <a href="index.html" class="logo">SAFAR<span>.</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="planner.html" class="active">Plan a Trip</a>
            <a href="http://localhost:5173" title="Run the React app first (see EXPLAIN.md)">Dashboard</a>
        </nav>
    </header>

    <main>
        <section class="page-title">
            <h1>Plan Your Trip</h1>
            <p class="section-note">Fill in the details and SAFAR's AI will write your itinerary.</p>
        </section>

        <!-- The planner form. planner.js handles its "submit" event. novalidate = we show our own messages -->
        <form class="trip-form" id="tripForm" novalidate>

            <label for="destination">Destination</label>
            <input type="text" id="destination" placeholder="Search a city or country...">

            <div class="row">
                <div>
                    <label for="startDate">Start date</label>
                    <input type="date" id="startDate">
                </div>
                <div>
                    <label for="endDate">End date</label>
                    <input type="date" id="endDate">
                </div>
            </div>

            <label for="travelers">Number of travellers</label>
            <input type="number" id="travelers" value="2" min="1" max="20">

            <label for="budget">Budget style</label>
            <select id="budget">
                <option value="Budget">Budget - smart and affordable</option>
                <option value="Moderate" selected>Moderate - comfort and value</option>
                <option value="Luxury">Luxury - premium experiences</option>
            </select>

            <!-- Checkboxes: the visitor can tick many interests -->
            <fieldset id="interests">
                <legend>Interests</legend>
                <label><input type="checkbox" value="Beaches"> Beaches</label>
                <label><input type="checkbox" value="Mountains"> Mountains</label>
                <label><input type="checkbox" value="Food"> Food</label>
                <label><input type="checkbox" value="History"> History</label>
                <label><input type="checkbox" value="Adventure"> Adventure</label>
                <label><input type="checkbox" value="Nature"> Nature</label>
            </fieldset>

            <!-- planner.js writes a validation message here when something is wrong -->
            <p class="error-message" id="formError" hidden></p>

            <button type="submit" class="btn btn-dark">Generate My Trip</button>
        </form>
    </main>

    <footer>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="explore.html">Explore</a></li>
        </ul>
        <p>&copy; 2026 SAFAR. Less scrolling. More exploring.</p>
    </footer>

    <script src="planner.js"></script>
</body>
</html>
